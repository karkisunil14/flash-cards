<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script type="module" src="./assets/js/index.js"></script>
  </head>
  <body class="page">
    <div class="page__main-content">
      <header>
        <div class="header__title">
          <h1 class="header__link">
            <a href="#">Flash Cards</a>
          </h1>
        </div>

        <nav>
          <ul>
            <li>
              <a class="nav__links" href="#">My Decks</a>
            </li>

            <!-- Optional Carousel Link -->

            <li>
              <a class="nav__link" href="#about">About</a>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <section class="carousel">
          <h2 class="carousel__title">1/10 &middot; Basic HTML Tags</h2>

          <div class="carousel__grid">
            <button
              type="button"
              aria-label="previous"
              class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
              disabled
            ></button>

            <div class="carousel__card">
              <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
            </div>

            <button
              type="button"
              aria-label="next"
              class="carousel__btn carousel__btn_type_right"
            ></button>
            <button
              type="button"
              aria-label="flip"
              class="carousel__btn carousel__btn_type_flip"
            ></button>
          </div>
        </section>
        <section id="home" class="gallery">
          <h2 class="gallery__title">My Decks</h2>

          <div class="wrapping-row">
            <ul class="gallery__list wrapping-row__display-contents">
              <template id="deck-template">
                <li class="card card_color_green">
                  <a class="card__link" href="#"></a>
                  <h3 class="card__title"></h3>

                  <div class="card__row">
                    <p class="card__count"></p>

                    <button
                      type="button"
                      aria-label="Delete deck"
                      class="card__btn card__btn_type_delete"
                    ></button>
                  </div>
                </li>
              </template>
            </ul>

            <button type="button" class="gallery__new-deck-btn">
              + New Deck
            </button>
          </div>
        </section>

        <section id="deck-view" class="gallery" style="display: none">
          <div class="gallery__header">
            <h2 class="gallery__title"></h2>
            <button type="button" class="gallery__practice-btn">
              Practice
            </button>
          </div>
          <div class="wrapping-row">
            <ul class="gallery__list wrapping-row__display-contents">
              <template id="card-template">
                <li class="card card_color_green">
                  <h3 class="card__title"></h3>
                  <div class="card__row">
                    <button
                      type="button"
                      aria-label="Show answer"
                      class="card__btn card__btn_type_flip"
                    ></button>
                    <button
                      type="button"
                      aria-label="Delete card"
                      class="card__btn card__btn_type_delete"
                    ></button>
                  </div>
                </li>
              </template>
            </ul>
            <button
              type="button"
              class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
            >
              + New Card
            </button>
          </div>
        </section>
      </main>

      <!-- NOT FOUND VIEW -->
      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>

        <p class="not-found__text">Sorry, nothing found!</p>
      </section>

      <dialog id="confirmation-modal" class="modal">
        <form method="dialog" class="modal__content">
          <p class="modal__text">Are you sure you want to delete this?</p>
          <div class="modal__actions">
            <button
              type="submit"
              class="modal__button modal__button_type_cancel"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="modal__button modal__button_type_confirm"
            >
              Delete
            </button>
          </div>
        </form>
      </dialog>

      <footer>
        <p class="footer__text">&copy; 2026 Your name</p>
      </footer>
    </div>
  </body>
</html>
